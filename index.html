<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="./lib/index.min.css" />
    <link rel="stylesheet" href="./lib/markers-plugin.min.css" />

    <link rel="stylesheet" href="style.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "./lib/three.module.js",
          "@photo-sphere-viewer/core": "./lib/index.module.js",
          "@photo-sphere-viewer/markers-plugin": "./lib/markers-plugin.module.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- <p class="heading">Интерактивный 3D-тур</p>

    <p class="description">
      Lorem ipsum dolor, sit amet consectetur adipisicing elit.
    </p> -->

    <div class="tour">
      <!-- карта -->
      <div class="screen active" id="map-screen">
        <div class="map-canvas">
          <img src="./assets/map/kvrt.png" alt="Карта" class="map-image" />

          <div id="map-pins"></div>
        </div>
      </div>

      <!-- панорама -->
      <div id="pano-screen" class="screen">
        <div id="viewer"></div>

        <div class="pano-top-bar">
          <button id="btn-back-map" class="ui-btn">← На карту</button>
        </div>

        <div class="pano-bottom-bar">
          <button id="btn-prev" class="ui-btn">← Пред.</button>
          <button id="btn-next" class="ui-btn">След. →</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
